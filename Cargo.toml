[package]
edition = "2021"
build = "src/build.rs"
name = "cicada"
version = "1.3.1"
authors = ["Hugo Wang <w@mitnk.com>"]

description = "A simple Bash-like Unix shell."
repository = "https://github.com/mitnk/cicada"
keywords = ["shell", "unix"]
categories = ["command-line-utilities", "command-line-interface", "development-tools"]
license = "MIT"

[profile.release]
lto = true
strip = true

[lib]
name = "cicada"
path = "src/lib.rs"

[[bin]]
name = "cicada"
doc = false

[dependencies]
glob = "0.3.3"
lazy_static = "1.5.0"
libc = "0.2.178"
# lineread = { path = "../lineread" }
lineread = "0.7"
pest = "2.8"
pest_derive = "2.8"
regex = "1"
yaml-rust = "0.4.5"
structopt = { version = "0.3", default-features = false }

[dependencies.uuid]
path = "crates/uuid-1.26.0"
version = "1.26.0"
features = ["serde", "v4"]

[dependencies.exec]
path = "crates/exec-0.3.1"
version = "0.3.1"

[dependencies.errno]
path = "crates/errno-0.3.14"
version = "0.3.14"

[dependencies.nix]
version = "0.31"
features = ["fs", "process", "signal"]

[dependencies.clap]
version = "4.5"
default-features = false
features = ["std", "derive", "help"]

[dependencies.rusqlite]
version = "0.38"
features = ["bundled"]

[dependencies.time]
version = "0.3"
features = ["local-offset"]

[build-dependencies.time]
version = "0.3"
features = ["local-offset"]