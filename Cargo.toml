[package]
edition = "2021"
build = "src/build.rs"
name = "pls"
version = "1.3.1"
authors = ["Hugo Wang <w@mitnk.com>", "The Operator <op@gmail.com>"]
description = "A simple Bash-like Unix shell on the Windows Platform."
repository = "https://github.com"
keywords = ["shell"]
categories = ["command-line-utilities", "command-line-interface", "development-tools"]
license = "MIT"

[profile.release]
lto = true
strip = true

[lib]
name = "pls"
path = "src/lib.rs"

[[bin]]
name = "pls"
doc = false

[dependencies]
glob = "0.3.3"
lazy_static = "1.5.0"
# lineread = { path = "../lineread" }
lineread = "0.7"
pest = "2.8"
pest_derive = "2.8"
regex = "1"
yaml-rust = "0.4.5"
structopt = { version = "0.3", default-features = false }

[dependencies.uuid]
path = "crates/uuid-1.26.0"
version = "1.26.0"
features = ["serde", "v4"]

[dependencies.exec]
path = "crates/exec-0.3.1"
version = "0.3.1"

[dependencies.errno]
path = "crates/errno-0.3.14"
version = "0.3.14"

[dependencies.clap]
path = "crates/clap-4.6.6"
version = "4.6.6"
default-features = false
features = ["std", "derive", "help"]

[dependencies.rusqlite]
path = "crates/rusqlite-0.38.0"
version = "0.38"
features = ["bundled"]

[dependencies.time]
path = "crates/time-0.3.55"
version = "0.3.55"
features = ["local-offset"]

[build-dependencies.time]
path = "crates/time-0.3.55"
version = "0.3.55"
features = ["local-offset"]